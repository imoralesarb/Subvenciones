name: Reset flags subvenciones

on:
  schedule:
    # Todos los días a las 00:00 UTC
    - cron: "0 0 * * *"

  # Permite ejecutarlo manualmente desde GitHub
  workflow_dispatch:

jobs:
  reset-flags:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar dependencias
        run: |
          pip install supabase

      - name: Resetear flags
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python - <<'PY'
          import os
          from supabase import create_client
          
          SUPABASE_URL = os.environ["SUPABASE_URL"]
          SUPABASE_SERVICE_KEY = os.environ["SUPABASE_SERVICE_KEY"]
          
          supabase = create_client(SUPABASE_URL, SUPABASE_SERVICE_KEY)
          
          print("🔄 Reseteando flags de subvenciones en lotes...")
          
          total_actualizados = 0
          tamano_lote = 1000
          
          while True:
              # 1. Obtener un lote de IDs que todavía tengan alguna flag en True
              resp_select = (
                  supabase
                  .table("subvenciones")
                  .select("id")
                  .or_("es_novedad.eq.true,es_actualizada.eq.true")
                  .limit(tamano_lote)
                  .execute()
              )
              
              registros = resp_select.data or []
              if not registros:
                  break
                  
              ids = [r["id"] for r in registros]
              
              # 2. Actualizar ese lote específico de IDs
              supabase.table("subvenciones").update({
                  "es_novedad": False,
                  "es_actualizada": False
              }).in_("id", ids).execute()
              
              total_actualizados += len(ids)
              print(f"   -> Lote procesado: {total_actualizados} registros actualizados...")
              
              # Si trajimos menos del tamaño del lote, ya hemos terminado
              if len(registros) < tamano_lote:
                  break
          
          print(f"✅ Flags reseteadas correctamente. Total registros modificados: {total_actualizados}.")
          PY
